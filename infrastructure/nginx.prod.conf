events {
    worker_connections 1024;
}

http {
    upstream api {
        server api:3000;
    }

    upstream pharmacy {
        server pharmacy-portal:3000;
    }

    upstream regulator {
        server regulator-portal:3000;
    }

    # API Server
    server {
        listen 80;
        server_name api.yourdomain.com;

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Pharmacy Portal
    server {
        listen 80;
        server_name pharmacy.yourdomain.com;

        location / {
            proxy_pass http://pharmacy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Regulator Portal
    server {
        listen 80;
        server_name regulator.yourdomain.com;

        location / {
            proxy_pass http://regulator;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
